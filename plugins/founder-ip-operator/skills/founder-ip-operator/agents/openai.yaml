interface:
  display_name: "创始人 IP 操盘手"
  short_description: "结合经营诊断与人物故事，确定优先卡点，交付配套提问卡、视频数据复盘、改稿与后续验证"
  default_prompt: "使用 $founder-ip-operator，根据本次老板首访逐字稿建立独立档案，先核对经营目标、项目阶段、事实与表达风格，依据可用资料诊断优先卡点和30天行动，再完成内容策划报告；单条任务沿用已有档案；每条口播稿都配套逐段现场提问或提示卡，改稿同步更新；收到后台截图与视频时核对、定位、改稿并给下次验证建议，用户采纳后保存到当前客户档案供后续写稿沿用。"
